<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratorio Git - Sesion</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div>
          <p class="eyebrow">FEAT-07</p>
          <h1>Inicio de sesion</h1>
          <p class="muted">Acceso seguro para usuarios registrados.</p>
        </div>

        <form id="login-form" class="stack">
          <label>
            Correo
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Contrasena
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Iniciar sesion</button>
        </form>

        <form id="register-form" class="stack secondary">
          <h2>Crear cuenta de prueba</h2>
          <label>
            Nombre
            <input name="name" autocomplete="name" required />
          </label>
          <label>
            Correo
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Contrasena
            <input name="password" type="password" autocomplete="new-password" required minlength="6" />
          </label>
          <button type="submit">Registrar</button>
        </form>
      </section>

      <section class="panel account">
        <p class="eyebrow">Estado</p>
        <h2 id="status-title">Sin sesion activa</h2>
        <p id="status-text" class="muted">Inicia sesion para ver los datos de tu cuenta.</p>
        <div id="user-box" class="user-box" hidden></div>
        <button id="logout-button" type="button" hidden>Cerrar sesion</button>
        <p id="message" role="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
